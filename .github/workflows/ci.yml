name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - name: Install shfmt
        run: sudo apt-get update && sudo apt-get install -y shfmt
      - name: shellcheck
        run: shellcheck gh-pr-review
      - name: shfmt
        run: shfmt -d gh-pr-review
